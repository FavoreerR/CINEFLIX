<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CINEFLIX</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0e;color:#fff;font:15px system-ui,Arial}header{padding:22px 18px;background:#111116;display:flex;justify-content:space-between;align-items:center}.logo{color:#e50928;font-size:28px;font-weight:900;letter-spacing:2px}.badge{border:1px solid #444;border-radius:20px;padding:8px;font-size:11px}.hero{margin:16px;padding:38px 22px;border-radius:16px;background:linear-gradient(120deg,#85162c,#191921);min-height:220px}.hero h1{font-size:34px}.btn,.actions button{background:#e50928;color:white;border:0;border-radius:8px;padding:12px;font-weight:700}main{padding:16px 16px 95px}.search{width:100%;background:#22222a;border:1px solid #444;color:white;padding:14px;border-radius:10px}.tabs{display:flex;gap:8px;margin:16px 0}.tabs button{border:0;border-radius:20px;padding:10px;background:#292932;color:white}.tabs button.active{background:#e50928}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.card{background:#1b1b23;border-radius:12px;overflow:hidden}.poster{height:160px;background:linear-gradient(145deg,#632333,#292b38);display:grid;place-items:center;font-size:58px;background-size:cover;background-position:center}.details{padding:12px}.details small{display:block;color:#aaa;margin:5px 0}.actions{display:flex;gap:5px}.actions button{padding:9px;flex:1}.actions button:last-child{background:#40404b}.actions button:disabled{opacity:.45}nav{position:fixed;bottom:0;left:0;right:0;background:#16161b;display:flex;justify-content:space-around;padding:16px 4px 22px;border-top:1px solid #333}nav button{background:none;border:0;color:#eee}#player{display:none;position:fixed;inset:0;background:#080808;padding:24px;z-index:10}#player video,#player iframe{width:100%;height:60vh;max-height:75vh;margin-top:30px;border:0}footer{color:#999;font-size:12px;margin-top:30px}
 .genres{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px}.genres button{white-space:nowrap;border:1px solid #555;background:#292932;color:#fff;border-radius:18px;padding:9px}.genres button.active{background:#e50928;border-color:#e50928}.error{color:#ffb8b8;font-size:14px}#player{overflow:auto}#player video{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:contain;background:#000;margin-top:18px}#player iframe{aspect-ratio:16/9;height:auto;margin-top:18px}#player{padding:20px 16px}#player h2{font-size:23px;margin-top:22px}.retry{margin-top:12px} </style></head><body><header><span class="logo">CINEFLIX</span><span class="badge">GRATIS · LEGAL</span></header><section class="hero"><small>BIENVENIDO A CINEFLIX</small><h1>Tu cine, a tu ritmo.</h1><p>Disfruta contenido gratuito autorizado.</p><button class="btn" onclick="document.getElementById('catalog').scrollIntoView()">Explorar ▶</button></section><main><input id="search" class="search" placeholder="🔎 Buscar películas y series" oninput="render()"><div class="tabs"><button onclick="setFilter('Todo')">Todo</button><button onclick="setFilter('Película')">Películas</button><button onclick="setFilter('Serie')">Series</button></div><h2 id="catalog">Catálogo gratuito</h2><div id="genres" class="genres"></div><div id="grid" class="grid"></div><footer>Versión inicial de demostración. Cortometrajes abiertos y fuentes externas. La disponibilidad depende de sus servidores; las licencias pueden variar según la edición.</footer></main><nav><button onclick="setFilter('Todo')">⌂ Inicio</button><button onclick="setFilter('Película')">▣ Películas</button><button onclick="setFilter('Serie')">▤ Series</button><button onclick="setFilter('Favoritos')">♡ Mi lista</button></nav><div id="player"><button class="btn" onclick="closePlayer()">← Volver</button><h2 id="playing"></h2><video id="video" controls playsinline preload="metadata"></video><p id="videoError" class="error" role="alert"></p><button id="retry" class="btn retry" style="display:none" onclick="retryVideo()">Reintentar reproducción</button><iframe id="archivePlayer" title="Reproductor de Internet Archive" allow="autoplay; fullscreen" allowfullscreen style="display:none"></iframe></div><script>

];let filter='Todo';let genre='Todos los géneros';let favorites=[];try{favorites=JSON.parse(localStorage.getItem('cineflixFavorites')||'[]')}catch(e){}function setFilter(f){filter=f;render()}function setGenre(g){genre=g;render()}function render(){document.getElementById('genres').innerHTML=['Todos los géneros','Familiar','Acción','Aventura','Ciencia ficción','Musical'].map(g=>'<button class="'+(genre===g?'active':'')+'" onclick="setGenre(\''+g+'\')">'+g+'</button>').join('');document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.textContent===(filter==='Todo'?'Todo':filter==='Película'?'Películas':'Series')));const q=document.getElementById('search').value.toLowerCase();document.getElementById('grid').innerHTML=items.filter(t=>(filter==='Todo'||(filter==='Favoritos'?favorites.includes(t.id):t.type===filter))&&(genre==='Todos los géneros'||t.genre===genre)&&t.title.toLowerCase().includes(q)).map(t=>'<article class="card"><div class="poster" '+(t.poster?'style="background-image:url('+t.poster+')"':'')+'>'+(t.poster?'':t.emoji)+'</div><div class="details"><b>'+t.title+'</b><small>'+t.desc+'</small><div class="actions"><button '+((t.url||t.embed)?'':'disabled')+' onclick="play('+t.id+')">'+((t.url||t.embed)?'▶ Ver':'Próximamente')+'</button><button onclick="fav('+t.id+')">'+(favorites.includes(t.id)?'♥':'♡')+'</button></div></div></article>').join('')||'<p>No hay títulos disponibles.</p>'}function fav(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];localStorage.setItem('cineflixFavorites',JSON.stringify(favorites));render()}function play(id){const t=items.find(x=>x.id===id);if(!t.url&&!t.embed)return;document.getElementById('playing').textContent=t.title;document.getElementById('player').style.display='block';const v=document.getElementById('video');const frame=document.getElementById('archivePlayer');document.getElementById('videoError').textContent='';document.getElementById('retry').style.display='none';if(t.embed){v.style.display='none';frame.style.display='block';frame.src=t.embed}else{frame.style.display='none';v.style.display='block';v.dataset.backup=t.backup||'';v.dataset.backupUsed='';v.src=t.url;v.play().catch(()=>{document.getElementById('videoError').textContent='Pulsa ▶ para iniciar. Si no carga, utiliza Reintentar.';document.getElementById('retry').style.display='inline-block'})}}document.getElementById('video').addEventListener('error',()=>{const v=document.getElementById('video');if(v.dataset.backup&&!v.dataset.backupUsed){v.dataset.backupUsed='1';v.src=v.dataset.backup;v.load();return;}document.getElementById('videoError').textContent='No se pudo cargar el video. Comprueba tu conexión y vuelve a intentarlo.';document.getElementById('retry').style.display='inline-block'});function retryVideo(){const v=document.getElementById('video');document.getElementById('videoError').textContent='';document.getElementById('retry').style.display='none';v.load();v.play().catch(()=>{document.getElementById('videoError').textContent='No se pudo iniciar la reproducción.';document.getElementById('retry').style.display='inline-block'})}function closePlayer(){const v=document.getElementById('video');v.pause();v.removeAttribute('src');v.load();const frame=document.getElementById('archivePlayer');frame.src='about:blank';frame.style.display='none';document.getElementById('player').style.display='none'}render();
</script></body></html>
